<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./brand/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#214B7D" />
    <!--
      Pantalla de carga. Vive aquí, y no en el CSS de la app, porque tiene que
      verse antes de que llegue el JavaScript: es lo primero que ve quien abre
      el enlace. src/components/LoadingProgress.tsx reutiliza estas clases,
      así que al montar React todo sigue en su sitio y la barra pasa de
      "esperando" a mostrar el avance real.
    -->
    <style>
      html { background: #14213c; }
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 16px;
        pointer-events: none;
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
      }
      /* Sin tarjeta: el wombat, el texto y la barra van directo sobre el fondo. */
      .boot-loader-card {
        width: min(280px, 100%);
        box-sizing: border-box;
        display: grid;
        gap: 12px;
        color: #eef5ff;
      }
      /* El wombat: centrado sobre el texto. Con "reducir movimiento" el
         <picture> elige un cuadro fijo en vez de la animación. */
      .boot-loader-mascot {
        justify-self: center;
        display: block;
      }
      .boot-loader-mascot img {
        display: block;
        width: 120px;
        height: 80px;
      }
      .boot-loader-title {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-align: center;
      }
      .boot-loader-track {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(118, 207, 223, 0.16);
      }
      /* El avance recorta la barra desde la derecha: los extremos siguen
         redondeados y solo se anima clip-path, sin recalcular el diseño. */
      .boot-loader-bar {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #76cfdf;
        clip-path: inset(0 calc(100% - var(--progress, 0) * 100%) 0 0 round 999px);
        transition: clip-path 240ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      /* Sin avance conocido todavía (antes de saber cuántos archivos hay). */
      .is-indeterminate .boot-loader-bar {
        width: 38%;
        clip-path: none;
        transition: none;
        animation: boot-loader-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-loader-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(265%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-bar { transition: none; }
        .is-indeterminate .boot-loader-bar { animation: none; opacity: 0.55; }
      }
    </style>
    <meta
      name="description"
      content="Explore checked satellite images, water clues and nearby roads. WOMBAT helps you choose places to check in the field, with data verified before it appears on the map."
    />
    <title>WOMBAT Explorer · Verified satellite data</title>
  </head>
  <body>
    <div id="root">
      <!-- React reemplaza esto al montar (LoadingProgress usa el mismo marcado). -->
      <div class="boot-loader">
        <section class="boot-loader-card is-indeterminate" aria-label="Carga de la aplicación">
          <picture class="boot-loader-mascot" aria-hidden="true">
            <source srcset="./brand/wombat-loading-still.webp" media="(prefers-reduced-motion: reduce)" />
            <img src="./brand/wombat-loading.webp" width="120" height="80" alt="" />
          </picture>
          <p class="boot-loader-title" role="status">Cargando…</p>
          <div class="boot-loader-track" role="progressbar" aria-label="Avance de la carga">
            <span class="boot-loader-bar"></span>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
